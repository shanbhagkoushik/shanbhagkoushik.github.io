<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writing — Koushik Shanbhag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <nav>
        <a href="../index.html">Home</a>
      </nav>
    </header>
    <main>
      <a class="back-link" href="../index.html">← Back</a>
      <h1 class="page-title">Writing</h1>
      <div id="writing-list">
        <p class="empty-note">Loading posts…</p>
      </div>
    </main>
    <footer class="site-footer">
      <p class="copyright">© <span id="year"></span> Koushik Shanbhag</p>
    </footer>
  </div>

  <script src="../assets/blog.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    fetchAllPosts()
      .then((posts) => {
        renderPostList(posts, document.getElementById("writing-list"), {
          emptyMessage: "Nothing published yet.",
          postLinkBase: "post.html",
        });
      })
      .catch(() => {
        renderPostList([], document.getElementById("writing-list"), {
          emptyMessage: "Couldn't load posts — check the repo details in assets/blog.js.",
        });
      });
  </script>
</body>
</html>
