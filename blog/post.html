<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="tab-title">Writing — Koushik Shanbhag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <nav>
        <a href="../index.html">Home</a>
      </nav>
    </header>
    <main>
      <a class="back-link" href="index.html">← All writing</a>
      <div id="post-root">
        <p class="empty-note">Loading…</p>
      </div>
    </main>
    <footer class="site-footer">
      <p class="copyright">© <span id="year"></span> Koushik Shanbhag</p>
    </footer>
  </div>

  <script src="../assets/blog.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const slug = new URLSearchParams(window.location.search).get("slug");
    const root = document.getElementById("post-root");

    if (!slug) {
      root.innerHTML = '<p class="empty-note">No post specified.</p>';
    } else {
      fetchPostBySlug(slug)
        .then((post) => {
          if (!post) {
            root.innerHTML = '<p class="empty-note">Post not found.</p>';
            return;
          }
          document.getElementById("tab-title").textContent = `${post.title} — Koushik Shanbhag`;
          root.innerHTML = `
            <h1 class="page-title">${post.title}</h1>
            <p class="post-meta">${new Date(post.date).toLocaleDateString("en-US", { day: "2-digit", month: "short", year: "numeric" })}</p>
            <div class="post-body">${renderMarkdown(post.body)}</div>
          `;
        })
        .catch(() => {
          root.innerHTML = '<p class="empty-note">Couldn\'t load this post — check the repo details in assets/blog.js.</p>';
        });
    }
  </script>
</body>
</html>
